name: MSBuild CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        platform: [Win32, x64]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'
        
    - name: Generate Visual Studio project with CMake
      run: |
        if ("${{ matrix.platform }}" -eq "Win32") {
          cmake -A Win32 -B build32
        } else {
          cmake -A x64 -B build64
        }
        
    - name: Build with CMake
      run: |
        if ("${{ matrix.platform }}" -eq "Win32") {
          cmake --build build32 --config Release
        } else {
          cmake --build build64 --config Release
        }

    - name: Test IME loading and initialization
      shell: pwsh
      run: |
        $build = if ("${{ matrix.platform }}" -eq "Win32") { "build32" } else { "build64" }
        $test = Get-ChildItem $build -Recurse -Filter ime_load_test.exe | Select-Object -First 1
        $ime = Get-ChildItem $build -Recurse -Filter mzimeja.ime | Select-Object -First 1
        if (!$test -or !$ime) { throw "IME or test executable not found" }
        & $test.FullName $ime.FullName
        if ($LASTEXITCODE -ne 0) { throw "IME load test failed: $LASTEXITCODE" }
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mzimeja-${{ matrix.platform }}-Release
        path: |
          build${{ matrix.platform == 'Win32' && '32' || '64' }}/**/*.exe
          build${{ matrix.platform == 'Win32' && '32' || '64' }}/**/*.ime
          build${{ matrix.platform == 'Win32' && '32' || '64' }}/**/*.dll
        if-no-files-found: warn
