name: MSBuild CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        platform: [Win32, x64]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'
        
    - name: Generate Visual Studio project with CMake
      run: |
        if ("${{ matrix.platform }}" -eq "Win32") {
          cmake -A Win32 -B build32
        } else {
          cmake -A x64 -B build64
        }
        
    - name: Build with CMake
      run: |
        if ("${{ matrix.platform }}" -eq "Win32") {
          cmake --build build32 --config Release
        } else {
          cmake --build build64 --config Release
        }

    - name: Test IME loading and initialization
      shell: pwsh
      run: |
        $build = if ("${{ matrix.platform }}" -eq "Win32") { "build32" } else { "build64" }
        $test = Get-ChildItem $build -Recurse -Filter ime_load_test.exe | Select-Object -First 1
        $ime = Get-ChildItem $build -Recurse -Filter mzimeja.ime | Select-Object -First 1
        if (!$test -or !$ime) { throw "IME or test executable not found" }
        & $test.FullName $ime.FullName
        if ($LASTEXITCODE -ne 0) { throw "IME load test failed: $LASTEXITCODE" }
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mzimeja-${{ matrix.platform }}-Release
        path: |
          build${{ matrix.platform == 'Win32' && '32' || '64' }}/**/*.exe
          build${{ matrix.platform == 'Win32' && '32' || '64' }}/**/*.ime
          build${{ matrix.platform == 'Win32' && '32' || '64' }}/**/*.dll
        if-no-files-found: warn

  mingw32:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Install MinGW
      run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686 ninja-build
    - name: Build 32-bit IME
      run: |
        cmake -S . -B build32 -G Ninja \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
          -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build32 --target ime imetests ime_load_test
    - name: Check IME exports
      shell: bash
      run: |
        diff -u \
          <(awk '/^EXPORTS/{found=1; next} found && NF {print $1}' ime/mzimeja.def | tr -d '\r' | sort) \
          <(i686-w64-mingw32-objdump -p build32/mzimeja.ime |
            awk '/^\[Ordinal\/Name Pointer\] Table/{found=1; next} found && NF == 0 {exit} found {print $NF}' | sort)
